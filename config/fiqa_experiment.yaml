defaults:
  - _self_  # Hydra magic
  - dataset: fiqa
  - retriever: dpr
  - model: encoder


device: auto
base_path: "."
top_k: 10
eval_ks: [1, 5, 10, 100]  # every cutoff P@k, R@k and MRR@k are reported at
do_train: true

# Keep Hydra in the current directory to ensure relative paths are correct
hydra:
  run:
    dir: "outputs/${retriever.method}/"  # Separate directory for evaluation outputs

train:
  batch_size: 64
  lr: 0.0003
  weight_decay: 0.01
  epochs: 30
  patience: 5  # (0 = off)
  save_dir: outputs/dpr